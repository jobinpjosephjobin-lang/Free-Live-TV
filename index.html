
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamDeck IPTV</title>

    <!-- HLS support for .m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            color-scheme: dark;
            --background: #0b0e14;
            --panel: #151a23;
            --accent: #35d07f;
            --text: #f4f6fa;
            --muted: #9aa4b2;
            --border: #293140;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        header {
            padding: 18px 24px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: var(--accent);
        }

        #status {
            color: var(--muted);
            font-size: 13px;
        }

        .layout {
            display: grid;
            grid-template-columns: 310px minmax(0, 1fr);
            min-height: calc(100vh - 70px);
        }

        aside {
            padding: 18px;
            background: var(--panel);
            border-right: 1px solid var(--border);
        }

        .search {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--text);
            outline: none;
        }

        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }

        .channel {
            width: 100%;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 11px;
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
        }

        .channel:hover {
            background: #202735;
        }

        .channel.active {
            background: #173326;
            border-color: var(--accent);
        }

        .channel-icon {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            background: #252d3a;
            border-radius: 7px;
            color: var(--accent);
            font-weight: bold;
        }

        .channel-name {
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        main {
            padding: 24px;
            min-width: 0;
        }

        .player-card {
            max-width: 1100px;
            margin: 0 auto;
        }

        .player-title {
            margin: 0 0 16px;
            font-size: 23px;
        }

        .video-wrapper {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        video {
            display: block;
            width: 100%;
            max-height: 72vh;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .message {
            margin-top: 16px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.error {
            color: #ff9292;
        }

        .refresh-button {
            margin-top: 14px;
            padding: 10px 15px;
            border: 0;
            border-radius: 7px;
            background: var(--accent);
            color: #07140c;
            font-weight: bold;
            cursor: pointer;
        }

        .refresh-button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .empty {
            padding: 18px 5px;
            color: var(--muted);
            font-size: 14px;
        }

        @media (max-width: 760px) {
            .layout {
                grid-template-columns: 1fr;
            }

            aside {
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }

            .channel-list {
                max-height: 280px;
            }

            main {
                padding: 16px;
            }

            header {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">Stream<span>Deck</span> IPTV</div>
        <div id="status">Loading playlist...</div>
    </header>

    <div class="layout">
        <aside>
            <input
                id="search"
                class="search"
                type="search"
                placeholder="Search channels..."
                aria-label="Search channels"
            >

            <div id="channelList" class="channel-list">
                <div class="empty">Loading channels...</div>
            </div>
        </aside>

        <main>
            <div class="player-card">
                <h1 id="playerTitle" class="player-title">
                    Select a channel
                </h1>

                <div class="video-wrapper">
                    <video
                        id="video"
                        controls
                        playsinline
                        preload="none"
                    ></video>
                </div>

                <div id="message" class="message">
                    Your channels will appear automatically after the
                    playlist loads.
                </div>

                <button id="refreshButton" class="refresh-button">
                    Reload Playlist
                </button>
            </div>
        </main>
    </div>

    <script>
        /*
         * CONFIGURATION
         * Replace this URL with your own M3U playlist URL.
         * The website loads this playlist automatically.
         */
        const PLAYLIST_URL =
            "https://your-provider.com/playlist.m3u";

        const video = document.getElementById("video");
        const channelList = document.getElementById("channelList");
        const playerTitle = document.getElementById("playerTitle");
        const message = document.getElementById("message");
        const status = document.getElementById("status");
        const search = document.getElementById("search");
        const refreshButton = document.getElementById("refreshButton");

        let channels = [];
        let hls = null;
        let activeChannelUrl = "";

        function setMessage(text, isError = false) {
            message.textContent = text;
            message.classList.toggle("error", isError);
        }

        function parseM3U(content) {
            const lines = content
                .replace(/^\uFEFF/, "")
                .split(/\r?\n/);

            const result = [];
            let current = null;

            for (const rawLine of lines) {
                const line = rawLine.trim();

                if (!line) continue;

                if (line.startsWith("#EXTINF")) {
                    const comma = line.indexOf(",");
                    const attributes = comma >= 0
                        ? line.slice(0, comma)
                        : line;

                    const name = comma >= 0
                        ? line.slice(comma + 1).trim()
                        : "";

                    const logoMatch = attributes.match(
                        /tvg-logo=["']([^"']*)["']/i
                    );

                    current = {
                        name: name || "Unnamed channel",
                        logo: logoMatch ? logoMatch[1] : "",
                        url: ""
                    };
                } else if (!line.startsWith("#")) {
                    if (current) {
                        current.url = line;
                        result.push(current);
                        current = null;
                    } else {
                        // Also support simple playlists containing only URLs.
                        result.push({
                            name: "Channel " + (result.length + 1),
                            logo: "",
                            url: line
                        });
                    }
                }
            }

            return result;
        }

        async function loadPlaylist() {
            refreshButton.disabled = true;
            status.textContent = "Loading playlist...";
            channelList.innerHTML =
                '<div class="empty">Loading channels...</div>';

            try {
                if (
                    !PLAYLIST_URL ||
                    PLAYLIST_URL.includes("your-provider.com")
                ) {
                    throw new Error(
                        "Add your actual playlist URL to PLAYLIST_URL in the code."
                    );
                }

                const response = await fetch(PLAYLIST_URL, {
                    method: "GET",
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(
                        "Playlist request failed: HTTP " + response.status
                    );
                }

                const content = await response.text();

                if (
                    !content.trim().startsWith("#EXTM3U") &&
                    !content.includes("#EXTINF")
                ) {
                    throw new Error(
                        "The URL did not return a valid M3U playlist."
                    );
                }

                channels = parseM3U(content);

                if (channels.length === 0) {
                    throw new Error("No channels were found in the playlist.");
                }

                renderChannels();
                status.textContent =
                    channels.length + " channels loaded";

                setMessage(
                    "Playlist loaded successfully. Select a channel to start playback."
                );
            } catch (error) {
                console.error("Playlist error:", error);
                channels = [];
                channelList.innerHTML =
                    '<div class="empty">Unable to load channels.</div>';

                status.textContent = "Playlist unavailable";
                setMessage(
                    error.message +
                    " Check the playlist URL and whether its server allows browser requests (CORS).",
                    true
                );
            } finally {
                refreshButton.disabled = false;
            }
        }

        function renderChannels() {
            const query = search.value.trim().toLowerCase();

            const filtered = channels.filter(channel =>
                channel.name.toLowerCase().includes(query)
            );

            channelList.innerHTML = "";

            if (filtered.length === 0) {
                channelList.innerHTML =
                    '<div class="empty">No matching channels.</div>';
                return;
            }

            filtered.forEach((channel, index) => {
                const button = document.createElement("button");
                button.className = "channel";

                if (channel.url === activeChannelUrl) {
                    button.classList.add("active");
                }

                const icon = document.createElement("div");
                icon.className = "channel-icon";
                icon.textContent = channel.name
                    .trim()
                    .charAt(0)
                    .toUpperCase() || "TV";

                const name = document.createElement("div");
                name.className = "channel-name";
                name.textContent = channel.name;

                button.append(icon, name);
                button.addEventListener("click", () => {
                    playChannel(channel);
                });

                channelList.appendChild(button);
            });
        }

        function playChannel(channel) {
            if (!channel.url) {
                setMessage("This channel has no stream URL.", true);
                return;
            }

            activeChannelUrl = channel.url;
            playerTitle.textContent = channel.name;
            renderChannels();

            if (hls) {
                hls.destroy();
                hls = null;
            }

            video.pause();
            video.removeAttribute("src");
            video.load();

            setMessage("Connecting to " + channel.name + "...");

            const url = channel.url;
            const isHls = /\.m3u8($|[?#])/i.test(url);

            if (isHls && window.Hls && Hls.isSupported()) {
                hls = new Hls();

                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {
                        setMessage(
                            "Stream is ready. Press Play to start watching."
                        );
                    });
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error("HLS playback error:", data);
                        setMessage(
                            "Unable to play this stream. It may be offline, blocked, or unsupported.",
                            true
                        );
                    }
                });
            } else {
                // Native HLS support or direct browser-supported stream.
                video.src = url;

                video.play().catch(() => {
                    setMessage(
                        "Stream selected. Press Play, or check whether the stream is supported by your browser."
                    );
                });
            }

            video.onerror = () => {
                setMessage(
                    "Playback failed. The stream may be offline, require authorization, or block browser playback.",
                    true
                );
            };
        }

        search.addEventListener("input", renderChannels);
        refreshButton.addEventListener("click", loadPlaylist);

        // Automatically load the embedded playlist when the page opens.
        loadPlaylist();
    </script>
</body>
</html>
